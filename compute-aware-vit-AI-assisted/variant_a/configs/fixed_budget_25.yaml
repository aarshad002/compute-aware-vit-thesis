model:
  name: deit_tiny_patch16_224
  num_classes: 100
  pretrained: true
  # Optional: path to baseline best_model.pt for warm initialisation
  checkpoint: null

pruning:
  keep_ratio: 0.25
  prune_layer: 6
  # controller is disabled — fixed budget only (no dynamic routing)
  controller: false

dataset:
  name: cifar100
  image_size: 224
  data_dir: /home/arooba/compute-aware-vit-thesis/data/

training:
  epochs: 20
  batch_size: 32
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.0001
  seed: 42

output:
  # Deterministic path (no timestamp) so cascade inference can reliably load
  dir: ./outputs/fixed_budget_25
