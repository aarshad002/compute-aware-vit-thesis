<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- gridlines -->
  <g stroke="#ececea" stroke-width="1">
    <line x1="70" y1="310" x2="610" y2="310"/>
    <line x1="70" y1="240" x2="610" y2="240"/>
    <line x1="70" y1="170" x2="610" y2="170"/>
    <line x1="70" y1="100" x2="610" y2="100"/>
    <line x1="70" y1="30"  x2="610" y2="30"/>
    <line x1="130" y1="30" x2="130" y2="380"/>
    <line x1="250" y1="30" x2="250" y2="380"/>
    <line x1="370" y1="30" x2="370" y2="380"/>
    <line x1="490" y1="30" x2="490" y2="380"/>
    <line x1="610" y1="30" x2="610" y2="380"/>
  </g>

  <!-- axes -->
  <g stroke="#b6b6b2" stroke-width="1.2">
    <line x1="70" y1="30" x2="70" y2="380"/>
    <line x1="70" y1="380" x2="610" y2="380"/>
  </g>

  <!-- y tick labels -->
  <g fill="#52514e" font-size="12" text-anchor="end">
    <text x="62" y="314">76</text>
    <text x="62" y="244">77</text>
    <text x="62" y="174">78</text>
    <text x="62" y="104">79</text>
    <text x="62" y="34">80</text>
  </g>
  <!-- x tick labels -->
  <g fill="#52514e" font-size="12" text-anchor="middle">
    <text x="130" y="398">0.7</text>
    <text x="250" y="398">0.8</text>
    <text x="370" y="398">0.9</text>
    <text x="490" y="398">1.0</text>
    <text x="610" y="398">1.1</text>
  </g>

  <!-- axis titles -->
  <text x="340" y="424" fill="#1a1a19" font-size="13.5" text-anchor="middle">Computational cost (GFLOPs)</text>
  <text x="24" y="205" fill="#1a1a19" font-size="13.5" text-anchor="middle" transform="rotate(-90 24 205)">Top-1 accuracy (%)</text>

  <!-- static pruning line + circles (blue) -->
  <polyline points="162.9,296.7 265.2,168.6 367.7,95.1" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <g fill="#2a78d6">
    <circle cx="162.9" cy="296.7" r="5"/>
    <circle cx="265.2" cy="168.6" r="5"/>
    <circle cx="367.7" cy="95.1"  r="5"/>
  </g>

  <!-- dynamic fixed-budget line + squares (aqua) -->
  <polyline points="114.9,321.9 271.7,157.4 428.4,88.8" fill="none" stroke="#1baf7a" stroke-width="2"/>
  <g fill="#1baf7a">
    <rect x="110.4" y="317.4" width="9" height="9"/>
    <rect x="267.2" y="152.9" width="9" height="9"/>
    <rect x="423.9" y="84.3"  width="9" height="9"/>
  </g>

  <!-- dense baseline star (dark) -->
  <path d="M585.3,40.9 L587.2,46.3 L592.9,46.4 L588.3,49.9 L590.0,55.4 L585.3,52.1 L580.6,55.4 L582.3,49.9 L577.7,46.4 L583.4,46.3 Z" fill="#1a1a19"/>

  <!-- direct point labels -->
  <g fill="#1a1a19" font-size="12">
    <text x="172" y="297" text-anchor="start">K=64</text>
    <text x="259" y="166" text-anchor="end">K=96</text>
    <text x="373" y="90"  text-anchor="start">K=128</text>
    <text x="114.9" y="340" text-anchor="middle">25%</text>
    <text x="279" y="153" text-anchor="start">50%</text>
    <text x="434" y="85"  text-anchor="start">75%</text>
    <text x="585.3" y="72" text-anchor="middle">Dense</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#1a1a19">
    <circle cx="95" cy="55" r="5" fill="#2a78d6"/>
    <text x="110" y="59" text-anchor="start">Static pruning</text>
    <rect x="90.5" y="73.5" width="9" height="9" fill="#1baf7a"/>
    <text x="110" y="82" text-anchor="start">Dynamic fixed-budget</text>
    <path d="M95,95 L96.4,99.1 L100.7,99.1 L97.3,101.7 L98.5,105.9 L95,103.4 L91.5,105.9 L92.7,101.7 L89.3,99.1 L93.6,99.1 Z" fill="#1a1a19"/>
    <text x="110" y="105" text-anchor="start">Dense baseline</text>
  </g>
</svg>
