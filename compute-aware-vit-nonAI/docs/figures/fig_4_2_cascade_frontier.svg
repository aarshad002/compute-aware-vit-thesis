<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>

  <!-- gridlines -->
  <g stroke="#ececea" stroke-width="1">
    <line x1="70" y1="362.3" x2="610" y2="362.3"/>
    <line x1="70" y1="306.9" x2="610" y2="306.9"/>
    <line x1="70" y1="251.5" x2="610" y2="251.5"/>
    <line x1="70" y1="196.2" x2="610" y2="196.2"/>
    <line x1="70" y1="140.8" x2="610" y2="140.8"/>
    <line x1="70" y1="85.4"  x2="610" y2="85.4"/>
    <line x1="70" y1="30"    x2="610" y2="30"/>
    <line x1="115" y1="30" x2="115" y2="390"/>
    <line x1="205" y1="30" x2="205" y2="390"/>
    <line x1="295" y1="30" x2="295" y2="390"/>
    <line x1="385" y1="30" x2="385" y2="390"/>
    <line x1="475" y1="30" x2="475" y2="390"/>
    <line x1="565" y1="30" x2="565" y2="390"/>
  </g>

  <!-- dense-cost reference line -->
  <line x1="456.5" y1="30" x2="456.5" y2="390" stroke="#9a9a96" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="452" y="44" fill="#6a6a66" font-size="11.5" text-anchor="end">dense cost</text>

  <!-- axes -->
  <g stroke="#b6b6b2" stroke-width="1.2">
    <line x1="70" y1="30" x2="70" y2="390"/>
    <line x1="70" y1="390" x2="610" y2="390"/>
  </g>

  <!-- y tick labels -->
  <g fill="#52514e" font-size="12" text-anchor="end">
    <text x="62" y="366">76</text>
    <text x="62" y="311">77</text>
    <text x="62" y="255">78</text>
    <text x="62" y="200">79</text>
    <text x="62" y="145">80</text>
    <text x="62" y="89">81</text>
    <text x="62" y="34">82</text>
  </g>
  <!-- x tick labels -->
  <g fill="#52514e" font-size="12" text-anchor="middle">
    <text x="115" y="408">0.7</text>
    <text x="205" y="408">0.8</text>
    <text x="295" y="408">0.9</text>
    <text x="385" y="408">1.0</text>
    <text x="475" y="408">1.1</text>
    <text x="565" y="408">1.2</text>
  </g>

  <!-- axis titles -->
  <text x="340" y="432" fill="#1a1a19" font-size="13.5" text-anchor="middle">Cumulative FLOPs (GFLOPs)</text>
  <text x="24" y="210" fill="#1a1a19" font-size="13.5" text-anchor="middle" transform="rotate(-90 24 210)">Top-1 accuracy (%)</text>

  <!-- cascade cumulative Pareto frontier -->
  <polyline points="113.9,346.2 133.5,320.2 163.4,278.7 203.5,221.1 243.0,181.2 279.3,155.7 309.3,140.2 338.8,112.5 365.4,96.5 398.1,82.1 430.3,74.9 455.6,64.9 502.9,47.7 552.4,42.7 572.0,40.0"
    fill="none" stroke="#eb6834" stroke-width="2.5"/>
  <g fill="#eb6834">
    <circle cx="113.9" cy="346.2" r="2.6"/>
    <circle cx="163.4" cy="278.7" r="2.6"/>
    <circle cx="203.5" cy="221.1" r="2.6"/>
    <circle cx="243.0" cy="181.2" r="2.6"/>
    <circle cx="279.3" cy="155.7" r="2.6"/>
    <circle cx="338.8" cy="112.5" r="2.6"/>
    <circle cx="398.1" cy="82.1"  r="2.6"/>
    <circle cx="455.6" cy="64.9"  r="2.6"/>
    <circle cx="502.9" cy="47.7"  r="2.6"/>
    <circle cx="572.0" cy="40.0"  r="2.6"/>
  </g>

  <!-- baseline: static (blue circles) -->
  <g fill="#2a78d6">
    <circle cx="139.7" cy="351.8" r="5"/>
    <circle cx="216.4" cy="250.4" r="5"/>
    <circle cx="293.3" cy="192.3" r="5"/>
  </g>
  <!-- baseline: dynamic fixed-budget (aqua squares) -->
  <g fill="#1baf7a">
    <rect x="99.2"  y="367.2" width="9" height="9"/>
    <rect x="216.8" y="237.1" width="9" height="9"/>
    <rect x="334.3" y="182.8" width="9" height="9"/>
  </g>
  <!-- baseline: dense (dark star) -->
  <path d="M456.5,147.7 L458.4,153.1 L464.1,153.2 L459.5,156.7 L461.2,162.2 L456.5,158.9 L451.8,162.2 L453.5,156.7 L448.9,153.2 L454.6,153.1 Z" fill="#1a1a19"/>

  <!-- legend -->
  <g font-size="12.5" fill="#1a1a19">
    <line x1="88" y1="50" x2="104" y2="50" stroke="#eb6834" stroke-width="2.5"/>
    <circle cx="96" cy="50" r="2.6" fill="#eb6834"/>
    <text x="110" y="54" text-anchor="start">Cascade frontier (cumulative)</text>
    <circle cx="96" cy="72" r="5" fill="#2a78d6"/>
    <text x="110" y="76" text-anchor="start">Static pruning</text>
    <rect x="91.5" y="89.5" width="9" height="9" fill="#1baf7a"/>
    <text x="110" y="98" text-anchor="start">Dynamic fixed-budget</text>
    <path d="M96,110 L97.4,114.1 L101.7,114.2 L98.3,116.7 L99.5,120.9 L96,118.4 L92.5,120.9 L93.7,116.7 L90.3,114.2 L94.6,114.1 Z" fill="#1a1a19"/>
    <text x="110" y="120" text-anchor="start">Dense baseline</text>
  </g>
</svg>
